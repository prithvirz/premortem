services:
  proxy:
    image: nginx:1.27
    ports:
      - "80:80"
    depends_on: [api]
  api:
    image: acme/api:3.1
    ports:
      - "8081:3000"
      - "9229:9229"
    environment:
      DATABASE_URL: postgres://app:change-me@db:5432/app
      LOG_LEVEL: info
    depends_on: [db]
  worker:
    image: acme/worker:3.1
    env_file: .env.worker
    environment:
      - LOG_LEVEL=info
    depends_on: [cache]
  db:
    image: postgres:16
  cache:
    image: redis:7
