name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Start production server
        run: |
          npx next start -p 3200 &
          for i in $(seq 1 30); do curl -sf http://localhost:3200 > /dev/null && break; sleep 1; done
      # GitHub-hosted Ubuntu runners include Google Chrome; the scripts use it via playwright-core.
      - name: Browser checks and accessibility audit
        env:
          PM_BROWSER_CHANNEL: chrome
        run: |
          node scripts/smoke.mjs http://localhost:3200
          node scripts/smoke-fix.mjs http://localhost:3200
          node scripts/a11y.mjs http://localhost:3200
